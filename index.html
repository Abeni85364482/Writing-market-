<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARITI MARKET</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#182235;font-family:Arial,sans-serif}header{background:#101c32;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}main{max-width:1000px;margin:22px auto;padding:0 14px}.hero,.panel,.item{background:white;border-radius:14px;padding:18px;margin-bottom:16px}.hero{background:linear-gradient(120deg,#173d78,#1769df);color:white}button{background:#1769df;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:bold}button.alt{background:#e8edf6;color:#172235}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd4e1;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.item{padding:0;overflow:hidden}.item img{width:100%;height:170px;object-fit:cover}.body{padding:13px}.price{color:#1769df;font-weight:bold;font-size:19px}.muted{color:#667085;font-size:13px}.hidden{display:none}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
</style></head><body><header><div><b>🛍️ ARITI MARKET</b><div style="font-size:12px">ገዛና ሽጥ — Buy & Sell</div></div><div class="row" style="flex:0"><button class="alt" id="language">English</button><button id="account">ግባ</button></div></header><main>
<section class="hero"><h2 id="welcome">ወደ ARITI MARKET እንኳን በደህና መጡ!</h2><p id="intro">ምርቶችን ይፈልጉ፣ ያስታውቁ፣ ከሻጩ ጋር በቀጥታ ይገናኙ።</p></section>
<section class="panel hidden" id="auth"><h3>Account / መለያ</h3><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">ግባ / Sign in</button> <button class="alt" id="signup">መለያ ፍጠር / Sign up</button><button class="alt hidden" id="signout">ውጣ / Sign out</button><p id="authmsg" class="muted"></p></section>
<section class="panel hidden" id="post"><h3 id="posttitle">ምርት ይለጥፉ / Post a product</h3><input id="name" placeholder="የምርት ስም / Product name"><div class="row"><input id="price" type="number" placeholder="ዋጋ / Price (ETB)"><select id="category"><option>Electronics</option><option>Clothing</option><option>Home</option><option>Vehicles</option><option>Real Estate</option><option>Food</option><option>Other</option></select></div><div class="row"><input id="seller" placeholder="የሻጭ ስም / Seller name"><input id="phone" placeholder="ስልክ / WhatsApp"></div><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><textarea id="description" placeholder="መግለጫ / Description"></textarea><button id="publish">አሳትም / Publish</button><p id="postmsg" class="muted"></p></section>
<section class="panel"><div class="row"><h3>ምርቶች / Products</h3><input id="search" placeholder="Search / ፈልግ"></div></section><section class="grid" id="products">Loading…</section></main><footer style="text-align:center;padding:25px;color:#667085">ARITI MARKET · Ethiopia</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://uuuiysoowojsqytgdnoo.supabase.co","sb_publishable_klraPqTbuK72dLJCirpIxg_qlPL1522");let user=null,lang="am",data=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function paint(){ $("language").textContent=lang==="am"?"English":"አማርኛ";$("welcome").textContent=lang==="am"?"ወደ ARITI MARKET እንኳን በደህና መጡ!":"Welcome to ARITI MARKET!";$("intro").textContent=lang==="am"?"ምርቶችን ይፈልጉ፣ ያስታውቁ፣ ከሻጩ ጋር በቀጥታ ይገናኙ።":"Discover products, post your own, and contact sellers directly.";render()}
async function authState(){let r=await db.auth.getSession();user=r.data.session?.user||null;$("post").classList.toggle("hidden",!user);$("account").textContent=user?(lang==="am"?"ውጣ":"Sign out"):(lang==="am"?"ግባ":"Sign in");$("signout").classList.toggle("hidden",!user);$("signin").classList.toggle("hidden",!!user);$("signup").classList.toggle("hidden",!!user)}
$("language").onclick=()=>{lang=lang==="am"?"en":"am";paint();authState()};$("account").onclick=async()=>{if(user){await db.auth.signOut();authState()}else $("auth").classList.toggle("hidden")};
$("signin").onclick=async()=>{let r=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("authmsg").textContent=r.error?.message||"Signed in";if(!r.error){$("auth").classList.add("hidden");authState()}};
$("signup").onclick=async()=>{let r=await db.auth.signUp({email:$("email").value,password:$("password").value});$("authmsg").textContent=r.error?.message||"Check your email to confirm signup."};
$("signout").onclick=async()=>{await db.auth.signOut();authState()};db.auth.onAuthStateChange(()=>authState());
async function load(){let r=await db.from("products").select("*").order("created_at",{ascending:false});if(r.error){$("products").textContent=r.error.message;return}data=r.data||[];render()}
function render(){let q=($("search").value||"").toLowerCase(),list=data.filter(p=>[p.name,p.category,p.description,p.seller_name].join(" ").toLowerCase().includes(q));$("products").innerHTML=list.length?list.map(p=>'<article class="item">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'<div style="height:170px;background:#e8edf6;display:grid;place-items:center;font-size:40px">🛍️</div>')+'<div class="body"><div class="muted">'+esc(p.category)+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+Number(p.price||0).toLocaleString()+' ETB</div><p>'+esc(p.description)+'</p><div class="muted">'+esc(p.seller_name)+'</div><a href="https://wa.me/'+String(p.phone||"").replace(/[^0-9]/g,"")+'" target="_blank" rel="noopener"><button>Contact seller / ሻጩን ያግኙ</button></a></div></article>').join(""):'<div class="panel">No products yet / ምርት አልተለጠፈም</div>'}
$("search").oninput=render;
$("publish").onclick=async()=>{if(!user)return; $("postmsg").textContent="Publishing…";let image_url=null,f=$("photo").files[0];if(f){if(f.size>4*1024*1024){$("postmsg").textContent="Image must be under 4 MB";return}let ext=f.name.split(".").pop().toLowerCase(),path=user.id+"/"+Date.now()+"."+ext;let up=await db.storage.from("product-images").upload(path,f,{contentType:f.type});if(up.error){$("postmsg").textContent=up.error.message;return}image_url=db.storage.from("product-images").getPublicUrl(path).data.publicUrl}
let p={user_id:user.id,name:$("name").value.trim(),price:Number($("price").value),category:$("category").value,seller_name:$("seller").value.trim(),phone:$("phone").value.trim(),description:$("description").value.trim(),image_url};let r=await db.from("products").insert(p);$("postmsg").textContent=r.error?.message||"Published!";if(!r.error){["name","price","seller","phone","description","photo"].forEach(id=>$(id).value="");load()}};paint();authState();load();
</script></body></html>
