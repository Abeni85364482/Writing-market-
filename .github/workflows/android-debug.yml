name: Build and publish ARITI MARKET Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Build Play Store app bundle (unsigned)
        working-directory: android
        run: gradle bundleRelease
      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: ariti-market-android-1.0.1
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish installable APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-test
          name: ARITI MARKET Android 1.0.1 (Test)
          body: |
            ARITI MARKET Android test build.
            Debug-signed APK for direct Android testing outside Google Play.
            This build wraps the live ARITI MARKET service and includes an app launcher icon,
            product photo picker support, safe external links, and an offline retry screen.
            The Play Store AAB is unsigned and is not ready for Play Console submission.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
